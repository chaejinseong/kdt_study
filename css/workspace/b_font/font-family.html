<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" , href="css/font-family2.css" />
    <title>폰트 패밀리(font-family)</title>
  </head>
  <body>
    <p>적용 안된 폰트</p>
    <p class="font">
      퉁퉁 부은 내 눈 속엔 아직 너를 보낸 눈물이 거울 속에 비친 내 모습은
      괜찮다며 웃는데 거울 밖에 난 울고 있잖아 넌 괜찮니 지금도 나는 실감나지
      않는다 어제 니가 쓰던 컵이 아직 나와 둘이 앉아있고 너의 사랑이 머물다 떠난
      내 방안의 슬픔은 내 가슴에 스며 내게 어제보다 더 큰 아픔을 주네
    </p>
  </body>
</html>
