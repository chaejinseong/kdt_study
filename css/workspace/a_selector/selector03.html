<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>클래스 선택자(class)</title>
    
    <style>
        .font{
            color:green;
        }
        .border{
            border: solid 1px black;
        }

        .font.border{
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- 클래스 여러개 : 사이에 공백문자 -->
    <h1 class="font border">클래스 선택자</h1>
    <h2>특정 부분에 스타일 적요아기</h2>
    <p>
        태그 선택자를 지정하면 그 태그가 사용된 모든 요소에 적용되지만,
        클래스 선택자를 이용하면 같은 태그라도 서로 다른 스타일을 넣을 수 있다.
        클래스 선택자의 기호는 <q>.</q>을 사용한다.
    </div>
    </p>
    <p class="font">실무에서는 스타일을 하나만 넣더라도 크래스 선택자를 이용한다.</p>
</body>
</html>
