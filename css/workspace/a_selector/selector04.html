<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>태그 선택자(tag)</title>
    <style>
        p {
            color: blue;
        }
    </style>
</head>
<body>
    <h1>태그 선택자</h1>
    <p>
        특정 태그를 사용하여 선택하므로, 전체 선택자 다음으로 가장 많은 요소들에 스타일을 적용시킬 수 있는 선택자이다.
    </p>
    <p class="text-color">태그 이름으로 선택한다.</p>
</body>
</html>
