<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택자(selector)</title>
    <!-- style 태그 == CSS -->
     <style>
        * {
            color: blue;
        }
     </style>
</head>
<body>
    <h1>전체 선택자 (asterisk)</h1>
    <h2>전체 선택자의 기호 : *</h2>
</body>
</html>
