<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자식 자손 선택자 실습</title>

    <style>
        .container input{
            border-color: blue;
        }

        div > label{
            display: block;
            width: 200px;
            height: 200px;
            background-color: pink;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <img src="아이콘" alt="폰" />
            <input type="text" placeholder="휴대폰번호" />
        </div>
        <div>
            <label>
                <input type="checkbox" name="">
                <div>
                    <p>모두 확인하였으며 동의합니다.</p>
                    <span> 전체 동의에는 필수 및 선택 정보에 대한 동의가 포함되어 있으며, 개별적으로 동의를 선택 하실 수 있습니다. 선택 항목에 대한 동의를 거부하시는 경우에도 서비스 이용이 가능합니다.</span>
                </div>
            </label>
        </div>
    </div>
</body>
</html>
