<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가상 요소 선택자</title>

    <style>
        button:active{
            background-color: pink;
        }
        button:hover{
            color: blue;
        }
        a:visited{
            color: blue;
        }
        a:link{
            color: black;
        }
        p::after{
            content: "";
            display: block;
            width: 100px;
            height: 100px;
            background: red;
        }
        p::before{
            content: "";
            display: block;
            width: 100px;
            height: 100px;
            background: red;
        }
    </style>
</head>
<body>
    <!-- 
        - :link - 방문한 적이 없는 링크
        - :visited - 방문한 적이 있는 링크
        - :hover - 마우스를 롤오버 했을 때
        - :active - 마우스를 클릭했을 때
    -->
    <button class="btn">어흥!</button>
    <a href="https://store.kakao.com/kakaofriends">카카오프렌즈샵</a>
    <a href="https://www.naver.com">네이버</a>
    <p>글자!</p>
</body>
</html>
