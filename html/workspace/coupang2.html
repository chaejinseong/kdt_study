<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://login.coupang.com/favicon.ico" type="image/x-icon">
    <title>회원가입</title>
</head>
<body>
    <div>
        <img src="https://static.coupangcdn.com/image/static/login/logo-coupang.x2.20201201.png" alt="로고">
    </div>
    <div>
        <span>회원정보를 입력해주세요.</span>
    </div>
    <form action="#">
        <div>
            <img src="메일" alt="메일" />
            <input type="text" placeholder="아이디(이메일)" />
        </div>
        <div>
            <img src="아이콘" alt="자물쇠" />
            <input type="text" placeholder="비밀번호" />
        </div>
        <div>
            <img src="아이콘" alt="자물쇠" />
            <input type="text" placeholder="비밀번호 확인" />
        </div>
        <div>
            <img src="아이콘" alt="유저" />
            <input type="text" placeholder="이름" />
        </div>
        <div>
            <img src="아이콘" alt="폰" />
            <input type="text" placeholder="휴대폰번호" />
        </div>
        <div>
            <label>
                <input type="checkbox" name="">
                <div>
                    <p>모두 확인하였으며 동의합니다.</p>
                    <span> 전체 동의에는 필수 및 선택 정보에 대한 동의가 포함되어 있으며, 개별적으로 동의를 선택 하실 수 있습니다. 선택 항목에 대한 동의를 거부하시는 경우에도 서비스 이용이 가능합니다.</span>
                </div>
            </label>
        </div>
        <div>
            <div>
                <label>
                    <input type="checkbox" name="">
                    <span>[필수] 만 14세 이상입니다</span>
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" name="">
                    <span>[필수] 쿠팡 이용약관 동의</span>
                    <img src=">" alt=">">
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" name="">
                    <span>[필수] 전자금융거래 이용약관 동의</span>
                    <img src=">" alt=">">
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" name="">
                    <span>[필수] 개인정보 제3자 제공 동의</span>
                    <img src=">" alt=">">
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" name="">
                    <span>[선택] 마케팅 목적의 개인정보 수집 및 이용 동의
                    <img src=">" alt=">">
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" name="">
                    <span>[선택] 광고성 정보 수신 동의</span>
                    <img src=">" alt=">">
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" name="">
                    <span>[선택] 이메일 수신 동의</span>
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" name="">
                    <span>[선택] SMS, SNS (카카오톡) 수신 동의</span>
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" name="">
                    <span>[선택] 앱 푸시 수신 동의</span>
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" name="">
                    <span>[선택] 야간 광고성 앱푸시 수신 동의 (밤 9시 ~ 익일 오전 8시)</span>
                    <img src=">" alt=">">
                </label>
            </div>
        </div>
        <div>
            <span>개인정보 수집 및 이용 안내를 확인해주세요</span>
        </div>
        <button>동의하고 가입하기</button>
    </form>
</body>
</html>
