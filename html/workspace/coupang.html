<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coupang</title>
  </head>
  <body>
    <div style="text-align: center;">
        <img src="https://static.coupangcdn.com/image/static/login/logo-coupang.x2.20201201.png" width="200">
      </div>
      <div style="width: 460px; margin: 0 auto">
        <form action="">
          <h3>회원 정보를 입력하세요</h3>
          <fieldset style="margin-bottom: 10px">
            <div>
              <img src="./image/envelope-solid.png" width="30" />
              <input type="text" placeholder="아이디(이메일)" />
            </div>
          </fieldset>
          <fieldset style="margin-bottom: 10px">
            <div>
              <img src="./image/lock-solid.png" width="30" />
              <input type="text" placeholder="비밀번호" />
            </div>
          </fieldset>
          <fieldset style="margin-bottom: 10px">
            <div>
              <img src="./image/lock-solid.png" width="30" />
              <input type="text" placeholder="비밀번호 확인" />
            </div>
          </fieldset>
          <fieldset style="margin-bottom: 10px">
            <div>
              <img src="./image/user-solid.png" width="30" />
              <input type="text" placeholder="이름" />
            </div>
          </fieldset>
          <fieldset style="margin-bottom: 10px">
            <div>
              <img src="./image/mobile-screen-button-solid.png" width="30" />
              <input type="text" placeholder="휴대폰 번호" />
            </div>
          </fieldset>
          <label
            ><input
              type="checkbox"
              name="동의"
              value="모두 확인하여
                        동의합니다."
            /><span>모두 확인하였으며 동의합니다.</span></label
          >
          <div>
            <h5>
              <span style="color: #999"
                >전체 동의에는 필수 및 선택 정보에 대한 동의가 포함되어있으며,
                개별적으로</span
              >
            </h5>
            <h5>
              <span style="color: #999"
                >동의를 선택할 수 있습니다. 선택 항목에 대한 동의를 거부하시는
                경우에도</span
              >
            </h5>
            <h5><span style="color: #999">서비스 이용이 가능합니다</span>.</h5>
          </div>

          <fieldset>
            <label
              ><input type="checkbox" name="agreement" value="Age." /><span
                >[필수] 만 14세 이상입니다.</span
              ></label
            ><br />
            <label
              ><input type="checkbox" name="동의" value="Usingcoupang" /><span
                >[필수] 쿠팡 이용약관 동의</span
              ></label
            ><a href="./detailcoupang.html" style="margin-left: 20px">&gt;</a
            ><br />
            <label
              ><input type="checkbox" name="동의" value="Economy" /><span
                >[필수] 전자금융거래 이용약관 동의</span
              ></label
            ><a href="./detailcoupang.html" style="margin-left: 20px">&gt;</a
            ><br />
            <label
              ><input type="checkbox" name="동의" value="Private" /><span
                >[필수] 개인정보 제 3자 제공 동의</span
              ></label
            ><a href="./detailcoupang.html" style="margin-left: 20px">&gt;</a
            ><br />
            <label
              ><input type="checkbox" name="동의" value="Marketing" /><span
                >[필수] 마케팅 목적의 개인정보 수집 및 이용 동의</span
              ></label
            ><a href="./detailcoupang.html" style="margin-left: 20px">&gt;</a
            ><br />
            <label
              ><input type="checkbox" name="동의" value="Advertisment" /><span
                >[선택] 광고성 정보 수신 동의</span
              ></label
            ><a href="./detailcoupang.html" style="margin-left: 20px">&gt;</a
            ><br />
            <div>
              <label style="margin-left: 20px"
                ><input type="checkbox" name="동의" value="night" /><span
                  >[선택] 이메일 수신 동의</span
                ></label
              ><br />
              <label style="margin-left: 20px"
                ><input type="checkbox" name="동의" value="night" /><span
                  >[선택] SMS, SNS(카카오톡) 수신 동의
                </span></label
              ><br />
              <label style="margin-left: 20px"
                ><input type="checkbox" name="agreement" value="apppush" />
                <span>[선택] 앱 푸시 수신 동의</span></label
              >
            </div>
            <label
              ><input type="checkbox" name="동의" value="night" /><span
                >[선택] 야간 광고성 앱푸시 수신 동의 (밤 9시 ~ 익일 오전
                8시)</span
              ></label
            ><br />
          </fieldset>
          <span>
            <a href="./private.html">개인정보 수집 및 이용 안내</a>를
            확인해주세요.</span
          ><br />
          <div style="text-align: center">
            <button style="width: 100%; height: 45px; font-size: 16px; color: white; background-color: blue;">동의하고 가입하기</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
