<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글자 서식 ㅌ ㅐ그</title>
</head>
<body>
    <!-- 문단 나눈는 태그 -->
    <p>Like me, like me</p>
    <!-- 문자열 표기 -->
    <!-- 줄바꿈 -->
    <span>아주 눈이 부신</span><br />
    <!-- (권장)글자 굻게 -->
    <strong>너를 숨김없이 보여줘</strong>
    <!-- bold 글자 굵게 -->
    <b>한 번도 빛난 적 없었던</b><br>
    <!-- 글자 기울이기(권장) -->
    <em>미지의 향으로</em>
    <i>온 세상을 물들여</i><br/>
    <!--  -->
    <mark>새로워진 장면에</mark>
    <del>두 눈앞은 황홀해 (yeah-yeah)</del><br/>
    <!-- under line : 밑줄 -->
    <ins>너의 손을 잡을 땐 (yeah-yeah)</ins>
    <!-- 윗첨자 -->
    <sup>너와 어우러질 땐</sup>
    <sub>빛을 이끌어 with me, with me</sub>
    <h1>마치 chemically</h1>
    <q>우린 완벽하게 어울려</q>
        <!-- 
        HTML 엔티티(Entities): 내용을 명령어로 인식하지 못하는 문법들
        - <  : &lt;
        - >  : &gt;
        - & : &amp;
        - “  : &quot;
        - 공백 : &nbsp;
        - ` : &quot; <q></q>
        - br : 줄바꿈 Line Brake 
    -->
    &lt;Feeling love attack&gt;
</body>
</html>
