<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>첫 HTML!😎</title>
</head>
<body>
    <h1>Hello, World~</h1>
    <!-- 
        [Ctrl] + [/]: 주석
        [Ctrl] + [D]: 줄 삭제
        [Ctrl] + [Shift] + [L]: 여러 단어 선택
        [Ctrl] + [Alt] + [↑] or [↓]: 여러 커서 선택
        [Alt] + [Shift] + [↑] or [↓]: 줄 복사
        [Alt] + [↑] or [↓]: 줄 이동
        [F1]: VS code 커널
        [Home]: 커서를 맨 앞으로
        [End]: 커서를 맨 뒤로
        [Shift] + [Home]: 커서부터 맨 앞까지 선택
        [Shift] + [End]: 커서부터 맨 뒤까지 선택
    -->
    <ul>
        <li>순위1: NEON</li>
        <li>순위2: 퇴사할게요</li>
        <li>순위3: 안녕히 가세요</li>
    </ul>
</body>
</html>
